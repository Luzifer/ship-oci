name: CI-Workflow

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: forgejo
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run make lint
        run: make lint

      - name: Run make test
        run: make test

      - name: Run make build
        run: make build

      - name: Run make trivy
        run: make trivy
