name: CI-Workflow

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: forgejo
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run make lint
        run: make lint

      - name: Run make test
        run: make test

      - name: Run make build
        run: make build

      - name: Run make trivy
        run: make trivy
