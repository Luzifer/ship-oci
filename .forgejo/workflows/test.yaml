name: CI-Workflow

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: forgejo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run make lint
        run: make lint

      - name: Run make test
        run: make test

      - name: Run make build
        run: make build

      - name: Run make trivy
        run: make trivy
